spring.application.name=catalogue
server.port=${SERVER_PORT:8081}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/catalogue_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:catalogue}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.threads.virtual.enabled=true
# Problem details are produced by ApiExceptionHandler, which extends ResponseEntityExceptionHandler ([STY-22], [STY-29]).
spring.mvc.problemdetails.enabled=true

# Fail fast when the pool is exhausted: the handler maps it to 503 ([STY-34]). Pool size is left to
# the default for now (25 connections per service could exceed the local PostgreSQL limit).
spring.datasource.hikari.connection-timeout=1000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=30000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Liveness never checks dependencies; readiness only the database ([OPS-18], [OPS-19]).
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

# Strict JSON ([API-51], [API-52]).
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false

# Operational values live in configuration, not in the requirements ([OPS-26]); bound and validated at boot ([OPS-22]).
catalogue.pagination.default-limit=50
catalogue.pagination.max-limit=200
